<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Cleaner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafafa;color:#111}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 40px}h1{font-size:22px;margin:0 0 6px}p{color:#666;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{background:#fff;color:#111;border:1px solid #ddd;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}button:hover{background:#f0f0f0}button.primary{background:#111;color:#fff;border-color:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
textarea{width:100%;min-height:340px;padding:15px;border:1px solid #ddd;border-radius:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;outline:none;resize:vertical}textarea:focus{border-color:#0095f6}
.stats{font-size:14px;color:#555;margin-top:10px}.opts{display:flex;flex-wrap:wrap;gap:14px;font-size:14px}.opts label{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
<h1>🧹 Text Cleaner</h1>
<p>Bersihkan teks tempelan dalam sekali klik — semua diproses lokal di browser, tanpa dikirim ke server.</p>
<div class="opts">
<label><input type="checkbox" id="optEmpty" checked> Hapus baris kosong</label>
<label><input type="checkbox" id="optDup" checked> Hapus baris duplikat</label>
<label><input type="checkbox" id="optTrim" checked> Rapikan spasi tiap baris</label>
<label><input type="checkbox" id="optSort"> Urutkan A–Z</label>
</div>
<div class="bar">
<button class="primary" onclick="clean()">Bersihkan</button>
<button onclick="transform('upper')">HURUF BESAR</button>
<button onclick="transform('lower')">huruf kecil</button>
<button onclick="transform('title')">Judul Kata</button>
<button onclick="copyOut()">Salin Hasil</button>
<button onclick="loadSample()">Contoh</button>
<button onclick="clearAll()">Hapus</button>
</div>
<div class="grid">
<textarea id="input" placeholder="Tempel teks berantakan di sini…" spellcheck="false"></textarea>
<textarea id="output" placeholder="Hasil bersih muncul di sini…" readonly spellcheck="false"></textarea>
</div>
<div class="stats" id="stats">0 karakter · 0 kata · 0 baris</div>
</div>
<script>
const $=id=>document.getElementById(id);
function updateStats(t){
  const words=t.trim()?t.trim().split(/\s+/).length:0;
  const lines=t?t.split('\n').length:0;
  $('stats').textContent=t.length.toLocaleString('id-ID')+' karakter · '+words.toLocaleString('id-ID')+' kata · '+lines+' baris';
}
function clean(){
  let lines=$('input').value.split('\n');
  if($('optTrim').checked) lines=lines.map(l=>l.replace(/\s+/g,' ').trim());
  if($('optEmpty').checked) lines=lines.filter(l=>l.length>0);
  if($('optDup').checked) lines=[...new Set(lines)];
  if($('optSort').checked) lines.sort((a,b)=>a.localeCompare(b,'id'));
  const out=lines.join('\n');
  $('output').value=out;
  updateStats(out);
}
function transform(mode){
  let t=$('input').value;
  if(mode==='upper') t=t.toUpperCase();
  if(mode==='lower') t=t.toLowerCase();
  if(mode==='title') t=t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  $('input').value=t;
  clean();
}
async function copyOut(){
  const t=$('output').value;
  if(!t) return;
  try{await navigator.clipboard.writeText(t);alert('Hasil disalin.');}
  catch(e){alert('Gagal menyalin otomatis, blok hasil lalu salin manual.');}
}
function loadSample(){
  $('input').value='  Halo   Dunia  \n\nHalo Dunia\napel\nMangga\napel\n  pisang  ';
  clean();
}
function clearAll(){$('input').value='';$('output').value='';updateStats('');}
$('input').addEventListener('input',()=>updateStats($('input').value));
loadSample();
</script>
</body>
</html>
