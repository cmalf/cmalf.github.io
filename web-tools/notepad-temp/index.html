<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad Offline</title>
    <style>
        :root {
            --bg: #0e1014;
            --panel: #171a21;
            --panel-2: #1d212b;
            --text: #e7e9ee;
            --muted: #9aa3b2;
            --line: rgba(255, 255, 255, .09);
            --accent: #7dd3fc;
            --accent-2: #a78bfa;
            --radius: 18px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
            background:
                radial-gradient(700px 340px at 15% -10%, rgba(125, 211, 252, .18), transparent 60%),
                radial-gradient(700px 340px at 90% 0%, rgba(167, 139, 250, .16), transparent 60%),
                var(--bg);
            min-height: 100dvh;
        }

        .app {
            max-width: 920px;
            height: 100dvh;
            margin: 0 auto;
            padding: 22px 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeIn .45s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 2px 4px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .dots {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
        }

        .dots i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
        }

        .dots i:nth-child(1) { background: #ff5f57; }
        .dots i:nth-child(2) { background: #febc2e; }
        .dots i:nth-child(3) { background: #28c840; }

        .brand h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -.2px;
            white-space: nowrap;
        }

        .brand h1 span {
            color: var(--muted);
            font-weight: 500;
        }

        .tools {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 12px;
            color: var(--muted);
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            padding: 6px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .badge b { color: #a7f3d0; font-weight: 600; }

        .btn {
            appearance: none;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .07);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 13px;
            border-radius: 999px;
            cursor: pointer;
            transition: background .15s ease, transform .15s ease, border-color .15s ease;
        }

        .btn:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .18); }
        .btn:active { transform: scale(.97); }

        .btn-danger { color: #fca5a5; }
        .btn-danger:hover { background: rgba(248, 113, 113, .14); border-color: rgba(248, 113, 113, .35); }
        .btn-danger.confirming { background: #ef4444; color: #fff; border-color: #ef4444; }

        /* Editor card */
        .editor {
            flex: 1;
            min-height: 0;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, .45),
                inset 0 1px 0 rgba(255, 255, 255, .06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .editor:focus-within {
            border-color: rgba(125, 211, 252, .45);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, .45),
                0 0 0 4px rgba(125, 211, 252, .08),
                inset 0 1px 0 rgba(255, 255, 255, .06);
        }

        .editor-top {
            height: 8px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), #f472b6);
            opacity: .9;
        }

        textarea {
            flex: 1;
            width: 100%;
            min-height: 0;
            border: none;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 16px;
            line-height: 1.75;
            padding: 24px 26px;
            resize: none;
            outline: none;
            caret-color: var(--accent);
        }

        textarea::placeholder { color: #6b7280; }
        textarea::selection { background: rgba(125, 211, 252, .28); }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 2px 6px 0;
            color: var(--muted);
            font-size: 12.5px;
            flex-wrap: wrap;
        }

        #saved { transition: color .2s ease; }
        #saved.saving { color: var(--accent); }

        /* Scrollbar */
        textarea::-webkit-scrollbar { width: 10px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .14);
            border-radius: 999px;
            border: 2px solid var(--panel);
        }
        textarea::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .24); }

        @media (max-width: 560px) {
            .app { padding: 14px 12px 12px; gap: 10px; }
            .brand h1 { font-size: 15px; }
            .badge { display: none; }
            textarea { padding: 18px; font-size: 15px; line-height: 1.65; }
            .editor { border-radius: 14px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="brand">
                <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
                <h1>Notepad <span>— offline</span></h1>
            </div>
            <div class="tools">
                <span class="badge">● <b>Tersimpan otomatis</b> di perangkat ini</span>
                <button class="btn" id="copyBtn" type="button">Salin</button>
                <button class="btn btn-danger" id="clearBtn" type="button">Hapus</button>
            </div>
        </header>

        <section class="editor">
            <div class="editor-top" aria-hidden="true"></div>
            <textarea id="notepad" placeholder="Paste teks di sini...&#10;&#10;Tenang, semua yang kamu ketik langsung tersimpan otomatis di browser ini, tanpa internet."></textarea>
        </section>

        <footer class="footer">
            <span id="stats">0 karakter · 0 kata</span>
            <span id="saved">Tersimpan</span>
        </footer>
    </main>

    <script>
        const notepad = document.getElementById('notepad');
        const stats = document.getElementById('stats');
        const saved = document.getElementById('saved');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        let saveTimer;
        let clearTimer;
        let clearArmed = false;

        function updateStats() {
            const text = notepad.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            stats.textContent = text.length.toLocaleString('id-ID') + ' karakter · ' + words.toLocaleString('id-ID') + ' kata';
        }

        // Memuat teks yang tersimpan sebelumnya
        notepad.value = localStorage.getItem('offlineText') || '';
        updateStats();

        // Menyimpan teks secara otomatis saat ada perubahan
        notepad.addEventListener('input', () => {
            saved.textContent = 'Menyimpan...';
            saved.classList.add('saving');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                localStorage.setItem('offlineText', notepad.value);
                saved.textContent = 'Tersimpan';
                saved.classList.remove('saving');
            }, 300);
            updateStats();
        });

        clearBtn.addEventListener('click', () => {
            if (!notepad.value) {
                clearBtn.textContent = 'Sudah kosong';
                setTimeout(() => clearBtn.textContent = 'Hapus', 1500);
                return;
            }
            // Klik pertama = konfirmasi, biar nggak kepencet nggak sengaja.
            if (!clearArmed) {
                clearArmed = true;
                clearBtn.textContent = 'Yakin hapus?';
                clearBtn.classList.add('confirming');
                clearTimer = setTimeout(() => {
                    clearArmed = false;
                    clearBtn.textContent = 'Hapus';
                    clearBtn.classList.remove('confirming');
                }, 3000);
                return;
            }
            clearTimeout(clearTimer);
            clearArmed = false;
            clearBtn.textContent = 'Hapus';
            clearBtn.classList.remove('confirming');
            notepad.value = '';
            localStorage.removeItem('offlineText');
            updateStats();
            saved.textContent = 'Dikosongkan';
            saved.classList.remove('saving');
            notepad.focus();
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(notepad.value);
                copyBtn.textContent = 'Tersalin ✓';
            } catch (e) {
                notepad.select();
                document.execCommand('copy');
                copyBtn.textContent = 'Tersalin ✓';
            }
            setTimeout(() => copyBtn.textContent = 'Salin', 1500);
        });
    </script>
</body>
</html>
